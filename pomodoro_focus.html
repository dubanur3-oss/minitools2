<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zen Timer | Productividad Pomodoro</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&display=swap');
    body { background: #000; color: #fff; font-family: 'Outfit', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; transition: background 1s;}
    .clock { font-size: 8rem; font-weight: 800; text-shadow: 0 0 50px rgba(0,255,200,0.5); font-variant-numeric: tabular-nums; z-index:10;}
    .circles { position: absolute; width: 400px; height: 400px; border-radius: 50%; border: 2px solid rgba(0,255,200,0.2); z-index:1; animation: breathe 4s ease-in-out infinite alternate;}
    @keyframes breathe { 0% { transform: scale(0.9); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 100px rgba(0,255,200,0.3); } }
    
    .controls { display:flex; gap:20px; z-index:10; margin-top:20px;}
    button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color:#fff; padding:15px 30px; font-size:1.2rem; border-radius:30px; cursor:pointer; font-family:inherit;}
    button:hover { background: #fff; color: #000; }
    
    .ad-fixed { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:320px; height:50px; border:1px solid #333; display:flex; align-items:center; justify-content:center; color:#555;}
  </style>
</head>
<body>

  <div class="circles" id="ring"></div>
  <div class="clock" id="time">25:00</div>
  
  <div class="controls">
    <button id="btn-start" onclick="startTimer()">INICIAR ENFOQUE</button>
    <button onclick="resetTimer()">REINICIAR</button>
  </div>
  
  <div class="ad-fixed">[ ADSENSE ]</div>

  <script>
    let timeLeft = 25 * 60;
    let timerId = null;

    function render() {
        let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('time').textContent = `${m}:${s}`;
    }

    function startTimer() {
        if(timerId) return;
        document.getElementById('btn-start').textContent = "EN EJECUCIÓN...";
        document.getElementById('ring').style.borderColor = "rgba(255,0,100,0.5)"; // Red ring
        
        timerId = setInterval(() => {
            timeLeft--;
            render();
            if(timeLeft <= 0) {
                clearInterval(timerId);
                alert("¡Tiempo finalizado! Toma un descanso.");
                resetTimer();
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 25 * 60;
        document.getElementById('btn-start').textContent = "INICIAR ENFOQUE";
        document.getElementById('ring').style.borderColor = "rgba(0,255,200,0.2)";
        render();
    }
    render();
  </script>
</body>
</html>
