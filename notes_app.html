<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overnote | Audio/Video Transcriber</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
    :root { --bg: #0d1117; --sidebar: #06090e; --note-bg: #161b22; --accent: #00f5ff; --text: #c9d1d9; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; overflow: hidden; }
    
    #sidebar { width: 300px; background: var(--sidebar); border-right: 1px solid #30363d; display: flex; flex-direction: column; z-index:2;}
    .header { padding: 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; font-size: 1.2rem; color: var(--accent); }
    #btn-new { background: var(--accent); color: #000; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    #notes-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
    .note-item { padding: 15px; background: var(--bg); margin-bottom: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .note-item:hover { border-color: rgba(0,245,255,0.3); }
    .note-item.active { background: var(--note-bg); border-color: var(--accent); }
    
    #editor-container { flex-grow: 1; display: flex; flex-direction: column; padding: 40px; background: var(--bg); position: relative;}
    .top-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; z-index:10;}
    #note-title { background: transparent; border: none; color: #fff; font-size: 2.5rem; font-weight: 600; font-family: inherit; outline: none; flex-grow: 1;}
    
    #btn-dictate { background: #ff007f; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1.1rem; box-shadow: 0 0 15px rgba(255,0,127,0.4); transition: 0.3s;}
    #btn-dictate.recording { background: #ff0000; animation: pulse 1s infinite alternate;}
    @keyframes pulse { to { transform: scale(1.05); } }

    #note-content { flex-grow: 1; background: transparent; border: none; color: var(--text); font-size: 1.2rem; line-height: 1.6; font-family: inherit; resize: none; outline: none; width: 100%; z-index:10;}
    
    .ad-top { position: absolute; top: 0; right: 0; width: 300px; height: 90px; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #555; z-index:1;}
    
    .status-msg { color: #888; font-size: 0.9rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h2>🎙 Overnote AI</h2>
      <button id="btn-new">+ Nueva</button>
    </div>
    <div id="notes-list"></div>
  </div>

  <div id="editor-container">
    <div class="ad-top">[ ADSENSE ]</div>
    
    <div class="top-controls">
        <input type="text" id="note-title" placeholder="Título de la Nota..." autocomplete="off">
        <button id="btn-dictate">🔴 GRABAR / TRANSCRIBIR</button>
    </div>
    <div class="status-msg" id="status-msg">Inactivo. Haz clic en grabar para extraer el texto de tu voz o del video que suene de fondo.</div>
    
    <textarea id="note-content" placeholder="Si tienes un video de Youtube reproduciéndose, pon el altavoz del PC cerca del micrófono y actívalo. La IA transcribirá todo el texto aquí automáticamente..."></textarea>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('overnote_data')) || [];
    let activeId = null;
    let isRecording = false;
    let recognition;
    
    const uiList = document.getElementById('notes-list');
    const inputTitle = document.getElementById('note-title');
    const inputContent = document.getElementById('note-content');
    const btnDictate = document.getElementById('btn-dictate');
    const statusMsg = document.getElementById('status-msg');

    // Inicializar Web Speech API neuronal en el navegador
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'es-ES'; // Detectará español

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                }
            }
            if (finalTranscript !== '') {
                // Agregar al final del texto actual
                inputContent.value += finalTranscript;
                updateActive(); // Guarda automático
            }
        };

        recognition.onend = () => {
            // Reiniciar automáticamente si el usuario no lo pausó (Para saltar el limite de 60s)
            if (isRecording) recognition.start();
        };
        
        recognition.onerror = (e) => { console.log('Speech error', e); };
    } else {
        btnDictate.style.display = 'none';
        statusMsg.textContent = "Tu navegador no soporta transcripción web nativa. Usa Chrome o Edge.";
    }

    btnDictate.addEventListener('click', () => {
        if (!isRecording) {
            isRecording = true;
            recognition.start();
            btnDictate.textContent = "⏹ DETENER TRANSCRIPCIÓN";
            btnDictate.classList.add('recording');
            statusMsg.textContent = "Escuchando... Puedes reproducir un video y se convertirá en texto.";
        } else {
            isRecording = false;
            recognition.stop();
            btnDictate.textContent = "🔴 GRABAR / TRANSCRIBIR";
            btnDictate.classList.remove('recording');
            statusMsg.textContent = "Transcripción pausada.";
        }
    });

    // ── Lógica de Notas ──
    function save() { localStorage.setItem('overnote_data', JSON.stringify(notes)); }

    function renderList() {
      uiList.innerHTML = '';
      notes.sort((a,b) => b.updated - a.updated).forEach(n => {
        const div = document.createElement('div');
        div.className = `note-item ${n.id === activeId ? 'active' : ''}`;
        div.textContent = n.title || 'Nota de Voz sin título';
        div.onclick = () => loadNote(n.id);
        uiList.appendChild(div);
      });
    }

    function loadNote(id) {
      activeId = id;
      const n = notes.find(n => n.id === id);
      if(n) {
        inputTitle.value = n.title;
        inputContent.value = n.content;
      }
      renderList();
    }

    function updateActive() {
      if(!activeId) return;
      const n = notes.find(n => n.id === activeId);
      if(n) {
        n.title = inputTitle.value;
        n.content = inputContent.value;
        n.updated = Date.now();
        save();
        renderList();
      }
    }

    document.getElementById('btn-new').onclick = () => {
      const newNote = { id: Date.now().toString(), title: '', content: '', updated: Date.now() };
      notes.push(newNote);
      save();
      loadNote(newNote.id);
    };

    inputTitle.addEventListener('input', updateActive);
    inputContent.addEventListener('input', updateActive);

    // Init
    if(notes.length === 0) {
      notes.push({ id: Date.now().toString(), title: 'Video Trascrito', content: 'Aquí se guardará el texto originado de los videos de YouTube o tu micrófono...', updated: Date.now() });
    }
    loadNote(notes[0].id);
  </script>
</body>
</html>
