<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Base64 Coder | File to String</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');
    body { background: #0c0a13; color: #fff; font-family: 'Outfit', sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; margin:0; padding:20px;}
    .box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 16px; text-align: center; max-width: 600px; width:100%; border:1px solid #333; margin-top: 20px;}
    .file-btn { background: #7000ff; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width:100%; display:block;}
    input[type="file"] { display: none; }
    textarea { width: 100%; height: 200px; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; border-radius: 8px; margin-top: 20px; outline:none;}
    button { background: #fff; color: #000; font-weight: bold; padding: 10px 20px; border:none; border-radius:6px; cursor:pointer; margin-top:10px; width:100%;}
  </style>
</head>
<body>
  <div class="box">
    <h1 style="color:#7000ff;">Base64 Data Encoder</h1>
    <p>Sube cualquier imagen u archivo para leer su código binario directamente en texto B64 y usarlo dentro de archivos CSS o JS.</p>
    
    <label class="file-btn">
      <input type="file" id="fileIn">
      SELECCIONAR ARCHIVO
    </label>
    
    <textarea id="out" placeholder="El código aparecerá aquí..." readonly></textarea>
    <button onclick="navigator.clipboard.writeText(document.getElementById('out').value); alert('Copiado!')">COPIAR DATA URI</button>
  </div>
  
  <div style="margin-top:20px; text-align:center;">[ ESPACIO ADSENSE ]</div>

  <script>
    document.getElementById('fileIn').addEventListener('change', e => {
       const file = e.target.files[0];
       if(!file) return;
       const reader = new FileReader();
       reader.onload = (ev) => {
           document.getElementById('out').value = ev.target.result;
       };
       reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
