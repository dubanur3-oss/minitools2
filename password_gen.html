<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Contraseñas Seguras — Toolbox Omega</title>
  <meta name="description" content="Genera contraseñas aleatorias ultra seguras en tu navegador. Sin servidores, sin registro.">
  <link rel="canonical" href="https://minitools2.vercel.app/password_gen.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    :root{--bg:#07090f;--bg2:#0d1120;--primary:#7000ff;--sec:#00f5ff;--surface:rgba(20,25,40,0.7);--border:rgba(112,0,255,0.3);--text:#e0e8ff;--dim:rgba(224,232,255,0.55)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column}
    nav{background:rgba(7,9,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px}
    .nav-logo{font-size:1.1rem;font-weight:800;background:linear-gradient(90deg,var(--sec),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;text-decoration:none}
    .back{color:var(--dim);text-decoration:none;font-size:.88rem;transition:color .2s}.back:hover{color:var(--sec)}
    main{flex:1;max-width:700px;margin:0 auto;padding:48px 24px;width:100%}
    h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .sub{color:var(--dim);margin-bottom:40px;font-size:.95rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;backdrop-filter:blur(20px)}
    .output-row{display:flex;gap:12px;margin-bottom:24px;align-items:center}
    .pw-box{flex:1;background:#0a0c14;border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:1.2rem;font-family:monospace;color:var(--sec);letter-spacing:2px;word-break:break-all;min-height:60px;display:flex;align-items:center}
    .btn{background:linear-gradient(135deg,var(--primary),#3d00cc);border:none;color:#fff;padding:14px 20px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap}
    .btn:hover{opacity:.85}.btn.copy{background:rgba(0,245,255,.12);border:1px solid var(--sec);color:var(--sec)}
    .controls{display:grid;gap:20px}
    .ctrl-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    label{font-size:.9rem;font-weight:600;color:var(--text)}
    input[type=range]{flex:1;accent-color:var(--primary);height:6px;cursor:pointer}
    .len-val{background:rgba(112,0,255,.15);border:1px solid var(--border);border-radius:8px;padding:4px 14px;font-weight:700;color:var(--sec);font-size:.95rem;min-width:44px;text-align:center}
    .toggle-row{display:flex;align-items:center;gap:12px}
    input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
    .strength{margin-top:20px;padding:14px 18px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .strength-label{font-size:.82rem;color:var(--dim)}
    .strength-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
    .strength-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
    .strength-text{font-size:.82rem;font-weight:700;min-width:60px;text-align:right}
    .copy-msg{font-size:.78rem;color:#00ff88;text-align:center;margin-top:12px;opacity:0;transition:opacity .3s}
    footer{text-align:center;padding:24px;color:var(--dim);font-size:.78rem;border-top:1px solid var(--border)}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TOOLBOX OMEGA</a>
  <a href="index.html" class="back">← Volver</a>
</nav>
<main>
  <h1>🔐 Generador de Contraseñas</h1>
  <p class="sub">Crea contraseñas ultra seguras al instante. Todo ocurre en tu navegador, nada se envía a ningún servidor.</p>
  <div class="card">
    <div class="output-row">
      <div class="pw-box" id="pwBox">Haz clic en Generar →</div>
      <button class="btn copy" onclick="copyPw()">📋 Copiar</button>
      <button class="btn" onclick="generate()">🔄 Generar</button>
    </div>
    <div class="controls">
      <div class="ctrl-row">
        <label>Longitud: </label>
        <input type="range" id="lengthSlider" min="6" max="64" value="20" oninput="onSlider()">
        <span class="len-val" id="lenVal">20</span>
      </div>
      <div class="toggle-row"><input type="checkbox" id="cbUpper" checked><label for="cbUpper">Mayúsculas (A–Z)</label></div>
      <div class="toggle-row"><input type="checkbox" id="cbLower" checked><label for="cbLower">Minúsculas (a–z)</label></div>
      <div class="toggle-row"><input type="checkbox" id="cbNumbers" checked><label for="cbNumbers">Números (0–9)</label></div>
      <div class="toggle-row"><input type="checkbox" id="cbSymbols" checked><label for="cbSymbols">Símbolos (!@#$%^&*)</label></div>
    </div>
    <div class="strength">
      <span class="strength-label">Fortaleza:</span>
      <div class="strength-bar"><div class="strength-fill" id="sFill" style="width:0%"></div></div>
      <span class="strength-text" id="sTxt">—</span>
    </div>
    <p class="copy-msg" id="copyMsg">✅ ¡Copiado al portapapeles!</p>
  </div>
</main>
<footer>Toolbox Omega — Sin servidores, sin registro. <a href="index.html" style="color:var(--sec)">Más herramientas →</a></footer>
<script>
  const UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ',LOWER='abcdefghijklmnopqrstuvwxyz',NUMS='0123456789',SYMS='!@#$%^&*()-_=+[]{}|;:,.<>?';
  function onSlider(){document.getElementById('lenVal').textContent=document.getElementById('lengthSlider').value;generate()}
  function generate(){
    let chars='';
    if(document.getElementById('cbUpper').checked)chars+=UPPER;
    if(document.getElementById('cbLower').checked)chars+=LOWER;
    if(document.getElementById('cbNumbers').checked)chars+=NUMS;
    if(document.getElementById('cbSymbols').checked)chars+=SYMS;
    if(!chars){document.getElementById('pwBox').textContent='Activa al menos una opción';return}
    const len=parseInt(document.getElementById('lengthSlider').value);
    const arr=new Uint32Array(len);
    crypto.getRandomValues(arr);
    const pw=Array.from(arr,v=>chars[v%chars.length]).join('');
    document.getElementById('pwBox').textContent=pw;
    updateStrength(pw,chars);
  }
  function updateStrength(pw,chars){
    let score=0;
    if(pw.length>=12)score+=1;if(pw.length>=20)score+=1;
    if(/[A-Z]/.test(pw))score+=1;if(/[a-z]/.test(pw))score+=1;
    if(/[0-9]/.test(pw))score+=1;if(/[^a-zA-Z0-9]/.test(pw))score+=1;
    const pct=Math.min(100,Math.round(score/6*100));
    const fill=document.getElementById('sFill'),txt=document.getElementById('sTxt');
    fill.style.width=pct+'%';
    if(pct<40){fill.style.background='#ff4444';txt.textContent='Débil';txt.style.color='#ff4444'}
    else if(pct<70){fill.style.background='#ffaa00';txt.textContent='Media';txt.style.color='#ffaa00'}
    else{fill.style.background='#00ff88';txt.textContent='Fuerte';txt.style.color='#00ff88'}
  }
  function copyPw(){
    const txt=document.getElementById('pwBox').textContent;
    if(txt==='Haz clic en Generar →'||txt==='Activa al menos una opción')return;
    navigator.clipboard.writeText(txt);
    const msg=document.getElementById('copyMsg');
    msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,2000);
  }
  generate();
  document.querySelectorAll('input').forEach(i=>i.addEventListener('change',generate));
</script>
</body>
</html>
