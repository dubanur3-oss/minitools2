<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector y Conversor de Color — Toolbox Omega</title>
  <meta name="description" content="Convierte colores entre HEX, RGB, HSL y HSV. Genera paletas complementarias y analógicas al instante.">
  <link rel="canonical" href="https://minitools2.vercel.app/color_picker.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    :root{--bg:#07090f;--bg2:#0d1120;--primary:#7000ff;--sec:#00f5ff;--surface:rgba(20,25,40,0.7);--border:rgba(112,0,255,0.3);--text:#e0e8ff;--dim:rgba(224,232,255,0.55)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column}
    nav{background:rgba(7,9,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px}
    .nav-logo{font-size:1.1rem;font-weight:800;background:linear-gradient(90deg,var(--sec),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;text-decoration:none}
    .back{color:var(--dim);text-decoration:none;font-size:.88rem;transition:color .2s}.back:hover{color:var(--sec)}
    main{flex:1;max-width:800px;margin:0 auto;padding:48px 24px;width:100%}
    h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .sub{color:var(--dim);margin-bottom:32px;font-size:.95rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;backdrop-filter:blur(20px);margin-bottom:20px}
    .picker-row{display:flex;gap:24px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
    input[type=color]{width:96px;height:96px;border:2px solid var(--border);border-radius:14px;cursor:pointer;background:none;padding:4px}
    .preview-box{flex:1;min-height:96px;border-radius:14px;border:2px solid var(--border);min-width:200px;transition:background .2s;position:relative}
    .preview-hex{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:1.2rem;font-weight:800;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
    .formats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
    .format-card{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:14px}
    .format-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px}
    .format-val{font-family:monospace;font-size:.95rem;color:var(--sec);cursor:pointer;transition:opacity .2s}
    .format-val:hover{opacity:.7}
    .copy-hint{font-size:.65rem;color:var(--dim);margin-top:4px}
    .palette-title{font-size:1rem;font-weight:700;margin-bottom:16px}
    .palette-row{display:flex;gap:8px;flex-wrap:wrap}
    .swatch{flex:1;min-width:60px;height:64px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative;min-width:50px}
    .swatch:hover{transform:scale(1.06);border-color:rgba(255,255,255,.3)}
    .swatch-label{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:.6rem;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap}
    .sliders{display:grid;gap:14px;margin-top:20px}
    .slider-row{display:flex;align-items:center;gap:12px}
    .slider-row label{width:30px;font-size:.8rem;color:var(--dim);font-weight:700}
    .slider-row input[type=range]{flex:1;height:6px;cursor:pointer}
    .slider-row span{width:36px;text-align:right;font-size:.85rem;color:var(--sec);font-weight:700}
    .copied-toast{position:fixed;bottom:24px;right:24px;background:rgba(0,255,136,.15);border:1px solid #00ff88;color:#00ff88;padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
    footer{text-align:center;padding:24px;color:var(--dim);font-size:.78rem;border-top:1px solid var(--border)}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TOOLBOX OMEGA</a>
  <a href="index.html" class="back">← Volver</a>
</nav>
<main>
  <h1>🎨 Selector de Color</h1>
  <p class="sub">Convierte entre HEX, RGB, HSL, HSV y CMYK. Genera paletas complementarias al instante.</p>
  <div class="card">
    <div class="picker-row">
      <input type="color" id="colorInput" value="#7000ff" oninput="onColorPick(this.value)">
      <div class="preview-box" id="previewBox" style="background:#7000ff">
        <div class="preview-hex" id="previewHex" style="color:#fff">#7000FF</div>
      </div>
    </div>
    <div class="formats-grid" id="formatsGrid"></div>
    <div class="sliders" style="margin-top:24px">
      <div class="slider-row">
        <label>R</label>
        <input type="range" id="slR" min="0" max="255" style="accent-color:#ff4444" oninput="onRgbSlider()">
        <span id="valR">112</span>
      </div>
      <div class="slider-row">
        <label>G</label>
        <input type="range" id="slG" min="0" max="255" style="accent-color:#44ff44" oninput="onRgbSlider()">
        <span id="valG">0</span>
      </div>
      <div class="slider-row">
        <label>B</label>
        <input type="range" id="slB" min="0" max="255" style="accent-color:#4444ff" oninput="onRgbSlider()">
        <span id="valB">255</span>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="palette-title">🔄 Paletas generadas</div>
    <div class="palette-title" style="font-size:.8rem;color:var(--dim);font-weight:400;margin-top:-10px;margin-bottom:16px">Clic en cualquier color para copiarlo</div>
    <div style="margin-bottom:20px"><div class="palette-title" style="font-size:.85rem">Complementario</div><div class="palette-row" id="palComp"></div></div>
    <div style="margin-bottom:20px"><div class="palette-title" style="font-size:.85rem">Análogo</div><div class="palette-row" id="palAnalog"></div></div>
    <div><div class="palette-title" style="font-size:.85rem">Tonos</div><div class="palette-row" id="palShades"></div></div>
  </div>
</main>
<div class="copied-toast" id="toast">¡Copiado!</div>
<footer>Toolbox Omega — <a href="index.html" style="color:var(--sec)">Más herramientas →</a></footer>
<script>
  let H=260,S=100,L=50,R=112,G=0,B=255;

  function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b}}
  function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join('')}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h/=6}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
  function hslToRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return{r:Math.round(f(0)*255),g:Math.round(f(8)*255),b:Math.round(f(4)*255)}}
  function rgbToCmyk(r,g,b){r/=255;g/=255;b/=255;const k=1-Math.max(r,g,b);if(k===1)return{c:0,m:0,y:0,k:100};return{c:Math.round((1-r-k)/(1-k)*100),m:Math.round((1-g-k)/(1-k)*100),y:Math.round((1-b-k)/(1-k)*100),k:Math.round(k*100)}}
  function luminance(r,g,b){return (0.299*r+0.587*g+0.114*b)/255}

  function onColorPick(hex){
    const {r,g,b}=hexToRgb(hex);R=r;G=g;B=b;updateFromRgb();
  }
  function onRgbSlider(){
    R=parseInt(document.getElementById('slR').value);
    G=parseInt(document.getElementById('slG').value);
    B=parseInt(document.getElementById('slB').value);
    updateFromRgb();
  }
  function updateFromRgb(){
    const hex=rgbToHex(R,G,B);
    const hsl=rgbToHsl(R,G,B);H=hsl.h;S=hsl.s;L=hsl.l;
    const cmyk=rgbToCmyk(R,G,B);
    const lum=luminance(R,G,B);
    const textCol=lum>.55?'#000':'#fff';
    document.getElementById('colorInput').value=hex;
    document.getElementById('previewBox').style.background=hex;
    document.getElementById('previewHex').textContent=hex;
    document.getElementById('previewHex').style.color=textCol;
    document.getElementById('slR').value=R;document.getElementById('slG').value=G;document.getElementById('slB').value=B;
    document.getElementById('valR').textContent=R;document.getElementById('valG').textContent=G;document.getElementById('valB').textContent=B;
    const formats=[
      {label:'HEX',val:hex,copy:hex},
      {label:'RGB',val:`rgb(${R}, ${G}, ${B})`,copy:`rgb(${R}, ${G}, ${B})`},
      {label:'HSL',val:`hsl(${H}, ${S}%, ${L}%)`,copy:`hsl(${H}, ${S}%, ${L}%)`},
      {label:'CMYK',val:`cmyk(${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%)`,copy:`cmyk(${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%)`},
    ];
    document.getElementById('formatsGrid').innerHTML=formats.map(f=>`<div class="format-card" onclick="copyStr('${f.copy}')"><div class="format-label">${f.label}</div><div class="format-val">${f.val}</div><div class="copy-hint">Clic para copiar</div></div>`).join('');
    generatePalettes();
  }

  function hslHex(h,s,l){const {r,g,b}=hslToRgb(((h%360)+360)%360,s,l);return rgbToHex(r,g,b)}

  function generatePalettes(){
    document.getElementById('palComp').innerHTML=[hslHex(H,S,L),hslHex(H+30,S,L),hslHex(H+180,S,L),hslHex(H+210,S,L)].map(c=>swatch(c)).join('');
    document.getElementById('palAnalog').innerHTML=[hslHex(H-60,S,L),hslHex(H-30,S,L),hslHex(H,S,L),hslHex(H+30,S,L),hslHex(H+60,S,L)].map(c=>swatch(c)).join('');
    document.getElementById('palShades').innerHTML=[10,25,40,55,70,85].map(l=>swatch(hslHex(H,S,l))).join('');
  }
  function swatch(hex){return `<div class="swatch" style="background:${hex}" onclick="applyColor('${hex}')" title="${hex}"><div class="swatch-label" style="color:${luminance(...Object.values(hexToRgb(hex)))>.55?'#000':'#fff'}">${hex}</div></div>`;}
  function applyColor(hex){onColorPick(hex);}
  function copyStr(s){navigator.clipboard.writeText(s);const t=document.getElementById('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}

  updateFromRgb();
</script>
</body>
</html>
