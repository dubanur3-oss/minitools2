<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscaminas | Toolbox Omega</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a13;color:#e2e8f0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
nav{width:100%;background:rgba(12,10,19,.95);border-bottom:1px solid rgba(255,255,255,.08);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{color:#00f5ff;font-weight:700;text-decoration:none}
.back{color:#94a3b8;text-decoration:none;font-size:.9rem}
h1{margin:20px 0 4px;font-size:1.8rem;color:#00f5ff}
.sub{color:#94a3b8;font-size:.9rem;margin-bottom:12px}
.diff{display:flex;gap:8px;margin-bottom:12px}
.d-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:.85rem}
.d-btn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
.hud{display:flex;gap:20px;margin-bottom:10px;align-items:center}
.hud-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 16px;font-size:1rem;font-weight:700}
.hud-item.mines{color:#ef4444}
.hud-item.timer{color:#00f5ff}
.face-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.grid{display:inline-grid;gap:2px;background:rgba(255,255,255,.05);padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.cell{width:30px;height:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .1s;user-select:none}
.cell:hover{background:rgba(255,255,255,.15)}
.cell.open{background:rgba(0,0,0,.3);cursor:default;border-color:rgba(255,255,255,.03)}
.cell.flag{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.cell.mine{background:rgba(239,68,68,.2);border-color:#ef4444}
.n1{color:#3b82f6}.n2{color:#22c55e}.n3{color:#ef4444}.n4{color:#7c3aed}.n5{color:#dc2626}.n6{color:#06b6d4}.n7{color:#fff}.n8{color:#94a3b8}
</style>
</head>
<body>
<nav><a class="brand" href="index.html">⚡ Toolbox Omega</a><a class="back" href="index.html">← Inicio</a></nav>
<h1>💣 Buscaminas</h1>
<p class="sub">Encuentra las minas con lógica</p>
<div class="diff">
<button class="d-btn active" onclick="setDiff(9,9,10,this)">Fácil</button>
<button class="d-btn" onclick="setDiff(16,16,40,this)">Medio</button>
<button class="d-btn" onclick="setDiff(16,30,99,this)">Difícil</button>
</div>
<div class="hud">
<div class="hud-item mines">💣 <span id="mines">10</span></div>
<button class="face-btn" id="face" onclick="newGame()">😊</button>
<div class="hud-item timer">⏱ <span id="timer">0</span>s</div>
</div>
<div class="grid" id="grid"></div>
<script>
let ROWS=9,COLS=9,MINES=10;
let board,revealed,flagged,firstClick,over,timerInt,seconds;
function setDiff(r,c,m,btn){ROWS=r;COLS=c;MINES=m;document.querySelectorAll('.d-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');newGame()}
function newGame(){
  clearInterval(timerInt);seconds=0;firstClick=true;over=false;
  document.getElementById('timer').textContent=0;
  document.getElementById('mines').textContent=MINES;
  document.getElementById('face').textContent='😊';
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  render();
}
function placeMines(sr,sc){
  let placed=0;
  while(placed<MINES){
    const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[r][c]===-1||(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1))continue;
    board[r][c]=-1;placed++;
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]===-1)continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)n++;
    }
    board[r][c]=n;
  }
}
function reveal(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(board[r][c]===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc)}
}
function click(r,c){
  if(over||flagged[r][c])return;
  if(firstClick){firstClick=false;placeMines(r,c);timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent=seconds},1000)}
  if(board[r][c]===-1){
    // reveal all mines
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(board[i][j]===-1)revealed[i][j]=true;
    revealed[r][c]=true;over=true;clearInterval(timerInt);
    document.getElementById('face').textContent='😵';render();return;
  }
  reveal(r,c);
  // check win
  let left=0;for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(!revealed[i][j]&&board[i][j]!==-1)left++;
  if(left===0){over=true;clearInterval(timerInt);document.getElementById('face').textContent='😎'}
  render();
}
function flag(r,c,e){
  e.preventDefault();if(over||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  const mineCount=MINES-[].concat(...flagged).filter(Boolean).length;
  document.getElementById('mines').textContent=mineCount;
  render();
}
function render(){
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${COLS},30px)`;
  g.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    const rev=revealed[r][c],flag=flagged[r][c],val=board[r][c];
    cell.className='cell'+(rev?' open':'')+(flag?' flag':'')+(rev&&val===-1?' mine':'');
    if(rev&&val===-1)cell.textContent='💣';
    else if(flag)cell.textContent='🚩';
    else if(rev&&val>0){cell.textContent=val;cell.classList.add('n'+val)}
    cell.addEventListener('click',()=>click(r,c));
    cell.addEventListener('contextmenu',e=>flag(r,c,e));
    // long press for mobile
    let t;
    cell.addEventListener('touchstart',()=>{t=setTimeout(()=>flag(r,c,{preventDefault:()=>{}}),500)},{passive:true});
    cell.addEventListener('touchend',()=>clearTimeout(t),{passive:true});
    g.appendChild(cell);
  }
}
newGame();
</script>
</body></html>
