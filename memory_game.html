<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory | Toolbox Omega</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a13;color:#e2e8f0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
nav{width:100%;background:rgba(12,10,19,.95);border-bottom:1px solid rgba(255,255,255,.08);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{color:#00f5ff;font-weight:700;text-decoration:none}
.back{color:#94a3b8;text-decoration:none;font-size:.9rem}
h1{margin:20px 0 4px;font-size:1.8rem;color:#00f5ff}
.sub{color:#94a3b8;font-size:.9rem;margin-bottom:12px}
.hud{display:flex;gap:24px;margin-bottom:16px;font-size:1rem}
.hud span{color:#7c3aed;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;width:100%;padding:0 12px}
.card{aspect-ratio:1;border-radius:10px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .4s;font-size:2rem}
.card.flipped,.card.matched{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;backface-visibility:hidden}
.card-back{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid rgba(124,58,237,.4)}
.card-back::after{content:'?';font-size:1.5rem;color:#7c3aed}
.card-front{background:rgba(255,255,255,.06);border:1px solid rgba(0,245,255,.2);transform:rotateY(180deg)}
.card.matched .card-front{border-color:#22c55e;background:rgba(34,197,94,.1)}
.controls{margin-top:20px;display:flex;gap:10px}
.btn{background:#7c3aed;border:none;color:#fff;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#e2e8f0}
.win{display:none;margin-top:20px;text-align:center;background:rgba(0,245,255,.06);border:1px solid rgba(0,245,255,.2);border-radius:12px;padding:20px 32px}
.win h2{color:#00f5ff;margin-bottom:6px}
.win p{color:#94a3b8}
.diff{display:flex;gap:8px;margin-bottom:12px}
.diff-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#94a3b8;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:.85rem}
.diff-btn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
</style>
</head>
<body>
<nav><a class="brand" href="index.html">⚡ Toolbox Omega</a><a class="back" href="index.html">← Inicio</a></nav>
<h1>🃏 Memory</h1>
<p class="sub">Encuentra todos los pares</p>
<div class="diff">
<button class="diff-btn active" onclick="setDiff(4,4,this)">Fácil 4×4</button>
<button class="diff-btn" onclick="setDiff(4,5,this)">Medio 4×5</button>
<button class="diff-btn" onclick="setDiff(6,6,this)">Difícil 6×6</button>
</div>
<div class="hud">Movimientos: <span id="moves">0</span> &nbsp; Pares: <span id="pairs">0</span>/<span id="total">8</span> &nbsp; ⏱ <span id="timer">0s</span></div>
<div class="grid" id="grid"></div>
<div class="win" id="win"><h2>🎉 ¡Ganaste!</h2><p id="winMsg"></p></div>
<div class="controls"><button class="btn" onclick="newGame()">🔄 Nueva partida</button></div>
<script>
const EMOJIS=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐧','🐦','🦋','🌸','🍎','🍊','🍋','🍇','🍓','⭐','🎯','🎸','🚀'];
let cols=4,rows=4,moves=0,matched=0,first=null,locked=false,timerInt,seconds=0,total;
function setDiff(c,r,btn){
  cols=c;rows=r;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  newGame();
}
function newGame(){
  clearInterval(timerInt);seconds=0;moves=0;matched=0;first=null;locked=false;
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent=0;
  document.getElementById('timer').textContent='0s';
  document.getElementById('win').style.display='none';
  total=cols*rows/2;
  document.getElementById('total').textContent=total;
  const grid=document.getElementById('grid');
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.maxWidth=cols*90+'px';
  const emojis=[...EMOJIS.slice(0,total),...EMOJIS.slice(0,total)];
  emojis.sort(()=>Math.random()-.5);
  grid.innerHTML='';
  emojis.forEach((e,i)=>{
    const card=document.createElement('div');
    card.className='card';card.dataset.val=e;card.dataset.idx=i;
    card.innerHTML=`<div class="card-face card-back"></div><div class="card-face card-front">${e}</div>`;
    card.addEventListener('click',flip);
    grid.appendChild(card);
  });
  timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent=seconds+'s'},1000);
}
function flip(e){
  const card=e.currentTarget;
  if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.classList.add('flipped');
  if(!first){first=card;return}
  moves++;document.getElementById('moves').textContent=moves;
  if(first.dataset.val===card.dataset.val){
    first.classList.add('matched');card.classList.add('matched');
    matched++;document.getElementById('pairs').textContent=matched;
    first=null;
    if(matched===total){clearInterval(timerInt);document.getElementById('winMsg').textContent=`En ${moves} movimientos y ${seconds} segundos`;document.getElementById('win').style.display='block'}
  }else{
    locked=true;const f=first;first=null;
    setTimeout(()=>{f.classList.remove('flipped');card.classList.remove('flipped');locked=false},900);
  }
}
newGame();
</script>
</body></html>
