<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Palabras y Caracteres — Toolbox Omega</title>
  <meta name="description" content="Cuenta palabras, caracteres, párrafos, oraciones y tiempo de lectura al instante. Gratis y privado.">
  <link rel="canonical" href="https://minitools2.vercel.app/word_counter.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    :root{--bg:#07090f;--bg2:#0d1120;--primary:#7000ff;--sec:#00f5ff;--surface:rgba(20,25,40,0.7);--border:rgba(112,0,255,0.3);--text:#e0e8ff;--dim:rgba(224,232,255,0.55)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column}
    nav{background:rgba(7,9,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px}
    .nav-logo{font-size:1.1rem;font-weight:800;background:linear-gradient(90deg,var(--sec),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;text-decoration:none}
    .back{color:var(--dim);text-decoration:none;font-size:.88rem;transition:color .2s}.back:hover{color:var(--sec)}
    main{flex:1;max-width:800px;margin:0 auto;padding:48px 24px;width:100%}
    h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .sub{color:var(--dim);margin-bottom:32px;font-size:.95rem}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:24px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 16px;text-align:center;backdrop-filter:blur(20px)}
    .stat-num{font-size:1.8rem;font-weight:800;color:var(--sec)}
    .stat-lbl{font-size:.75rem;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
    textarea{width:100%;height:280px;background:rgba(10,12,20,.8);border:1px solid var(--border);border-radius:14px;padding:20px;color:var(--text);font-family:'Outfit',sans-serif;font-size:1rem;line-height:1.7;resize:vertical;outline:none;transition:border-color .2s}
    textarea:focus{border-color:var(--sec)}
    textarea::placeholder{color:var(--dim)}
    .toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .btn{background:rgba(112,0,255,.15);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;transition:all .2s}
    .btn:hover{border-color:var(--sec);color:var(--sec)}
    .limit-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
    .limit-row label{font-size:.85rem;color:var(--dim)}
    .limit-row input[type=number]{width:100px;background:#0a0c14;border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Outfit',sans-serif;outline:none}
    .limit-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;min-width:100px}
    .limit-fill{height:100%;background:var(--sec);border-radius:3px;transition:width .2s,background .2s}
    .keyword-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:24px;backdrop-filter:blur(20px)}
    .keyword-box h3{font-size:1rem;font-weight:700;margin-bottom:14px}
    .kw-list{display:flex;flex-wrap:wrap;gap:8px}
    .kw{background:rgba(0,245,255,.07);border:1px solid rgba(0,245,255,.2);border-radius:20px;padding:4px 12px;font-size:.8rem;color:var(--sec)}
    footer{text-align:center;padding:24px;color:var(--dim);font-size:.78rem;border-top:1px solid var(--border)}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TOOLBOX OMEGA</a>
  <a href="index.html" class="back">← Volver</a>
</nav>
<main>
  <h1>📝 Contador de Palabras</h1>
  <p class="sub">Analiza tu texto al instante: palabras, caracteres, oraciones, párrafos y tiempo de lectura.</p>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="sWords">0</div><div class="stat-lbl">Palabras</div></div>
    <div class="stat-card"><div class="stat-num" id="sChars">0</div><div class="stat-lbl">Caracteres</div></div>
    <div class="stat-card"><div class="stat-num" id="sCharsNoSp">0</div><div class="stat-lbl">Sin espacios</div></div>
    <div class="stat-card"><div class="stat-num" id="sSentences">0</div><div class="stat-lbl">Oraciones</div></div>
    <div class="stat-card"><div class="stat-num" id="sParas">0</div><div class="stat-lbl">Párrafos</div></div>
    <div class="stat-card"><div class="stat-num" id="sRead">0s</div><div class="stat-lbl">Lectura</div></div>
  </div>
  <textarea id="ta" placeholder="Pega o escribe tu texto aquí…" oninput="analyze()"></textarea>
  <div class="limit-row">
    <label>Límite de palabras:</label>
    <input type="number" id="limitInput" placeholder="ej. 500" oninput="updateLimit()">
    <div class="limit-bar"><div class="limit-fill" id="limitFill" style="width:0%"></div></div>
    <span id="limitTxt" style="font-size:.82rem;color:var(--dim)"></span>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="clearText()">🗑️ Limpiar</button>
    <button class="btn" onclick="copyText()">📋 Copiar</button>
    <button class="btn" onclick="removeExtraSpaces()">✂️ Quitar espacios extra</button>
    <button class="btn" onclick="toUpperCase()">⬆️ MAYÚSCULAS</button>
    <button class="btn" onclick="toLowerCase()">⬇️ minúsculas</button>
  </div>
  <div class="keyword-box" id="kwBox" style="display:none">
    <h3>🔑 Palabras más frecuentes</h3>
    <div class="kw-list" id="kwList"></div>
  </div>
</main>
<footer>Toolbox Omega — <a href="index.html" style="color:var(--sec)">Más herramientas →</a></footer>
<script>
  function analyze(){
    const txt=document.getElementById('ta').value;
    const words=txt.trim()===''?[]:txt.trim().split(/\s+/);
    const sentences=txt===''?0:(txt.match(/[.!?]+/g)||[]).length;
    const paras=txt.trim()===''?0:txt.split(/\n\s*\n/).filter(p=>p.trim()).length||1;
    const wc=words.length;
    const readSec=Math.round(wc/4);
    document.getElementById('sWords').textContent=wc.toLocaleString();
    document.getElementById('sChars').textContent=txt.length.toLocaleString();
    document.getElementById('sCharsNoSp').textContent=txt.replace(/\s/g,'').length.toLocaleString();
    document.getElementById('sSentences').textContent=sentences;
    document.getElementById('sParas').textContent=paras;
    document.getElementById('sRead').textContent=readSec<60?readSec+'s':Math.floor(readSec/60)+'m '+readSec%60+'s';
    updateLimit(wc);
    updateKeywords(words);
  }
  function updateLimit(wc){
    const lim=parseInt(document.getElementById('limitInput').value)||0;
    if(!lim){document.getElementById('limitFill').style.width='0%';document.getElementById('limitTxt').textContent='';return}
    wc=wc??parseInt(document.getElementById('sWords').textContent.replace(',',''))||0;
    const pct=Math.min(100,Math.round(wc/lim*100));
    const fill=document.getElementById('limitFill');
    fill.style.width=pct+'%';
    fill.style.background=pct>=100?'#ff4444':pct>=80?'#ffaa00':'var(--sec)';
    document.getElementById('limitTxt').textContent=`${wc}/${lim}`;
  }
  function updateKeywords(words){
    if(words.length<5){document.getElementById('kwBox').style.display='none';return}
    const freq={};
    words.forEach(w=>{const k=w.toLowerCase().replace(/[^a-záéíóúüñ]/gi,'');if(k.length>3)freq[k]=(freq[k]||0)+1;});
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12);
    if(!sorted.length){document.getElementById('kwBox').style.display='none';return}
    document.getElementById('kwBox').style.display='block';
    document.getElementById('kwList').innerHTML=sorted.map(([w,c])=>`<div class="kw">${w} <strong style="color:#fff">${c}</strong></div>`).join('');
  }
  function clearText(){document.getElementById('ta').value='';analyze()}
  function copyText(){navigator.clipboard.writeText(document.getElementById('ta').value)}
  function removeExtraSpaces(){document.getElementById('ta').value=document.getElementById('ta').value.replace(/\s+/g,' ').trim();analyze()}
  function toUpperCase(){document.getElementById('ta').value=document.getElementById('ta').value.toUpperCase();analyze()}
  function toLowerCase(){document.getElementById('ta').value=document.getElementById('ta').value.toLowerCase();analyze()}
</script>
</body>
</html>
