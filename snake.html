<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
  <title>Snake | Retro Arcade</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body { background: #000; color: #fff; font-family: 'Press Start 2P', cursive; margin:0; display:flex; flex-direction:column; align-items:center; min-height:100vh;}
    h1 { color: #00ff00; font-size:1.5rem; text-align:center; text-shadow: 0 0 10px #00ff00; margin-top:20px;}
    canvas { background: #111; border: 4px solid #333; border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,0,0.2); }
    .score-board { margin: 10px 0; font-size: 0.8rem; color:#fff;}
    
    .d-pad { display: grid; grid-template-columns: 60px 60px 60px; gap: 10px; margin-top: 20px;}
    .d-btn { background: #222; border: 2px solid #555; border-radius:8px; height: 60px; color:#fff; font-size:1.5rem; font-weight:bold; cursor:pointer;}
    .d-btn:active { background: #00ff00; color:#000;}
    #btn-up { grid-column: 2; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    .ad-slot { margin-top:30px; padding:20px; border:1px dashed #333; color:#555; text-align:center; font-family:sans-serif;}
  </style>
</head>
<body>

  <h1>SNAKE ARCADE</h1>
  <div class="score-board">PUNTAJE: <span id="sc">0</span> | RECORD: <span id="hi">0</span></div>
  
  <canvas id="game" width="300" height="300"></canvas>

  <!-- Controles Moviles -->
  <div class="d-pad">
     <button class="d-btn" id="btn-up">↑</button>
     <button class="d-btn" id="btn-left">←</button>
     <button class="d-btn" id="btn-down">↓</button>
     <button class="d-btn" id="btn-right">→</button>
  </div>

  <div class="ad-slot">[ BANNER ADSENSE PARA JUEGOS ]</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    let box = 15;
    let snake = [];
    snake[0] = { x: 9 * box, y: 10 * box };
    let food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
    
    let score = 0;
    let record = localStorage.getItem('snake_hi') || 0;
    document.getElementById('hi').textContent = record;
    
    let d;
    document.addEventListener('keydown', direction);
    function direction(event) {
        if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(event.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    document.getElementById('btn-up').onclick = ()=> { if(d!="DOWN") d="UP"};
    document.getElementById('btn-left').onclick = ()=> { if(d!="RIGHT") d="LEFT"};
    document.getElementById('btn-down').onclick = ()=> { if(d!="UP") d="DOWN"};
    document.getElementById('btn-right').onclick = ()=> { if(d!="LEFT") d="RIGHT"};

    function collision(head, array) {
        for(let i=0; i<array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    function draw() {
        ctx.fillStyle = "#111";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        for(let i=0; i<snake.length; i++){
            ctx.fillStyle = (i==0) ? "#00ff00" : "#00aa00";
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
            ctx.strokeStyle = "#000";
            ctx.strokeRect(snake[i].x, snake[i].y, box, box);
        }
        
        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, box, box);
        
        // Movimiento
        let snakeX = snake[0].x; let snakeY = snake[0].y;
        if(d == "LEFT") snakeX -= box;
        if(d == "UP") snakeY -= box;
        if(d == "RIGHT") snakeX += box;
        if(d == "DOWN") snakeY += box;
        
        // Comer
        if(snakeX == food.x && snakeY == food.y) {
            score++;
            document.getElementById('sc').textContent = score;
            if(score > record) { record = score; localStorage.setItem('snake_hi', record); document.getElementById('hi').textContent = record;}
            food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
        } else {
            snake.pop(); // quitar cola si no avanza comiendo
        }
        
        let newHead = { x: snakeX, y: snakeY };
        
        // Muerte
        if(snakeX < 0 || snakeX > 19*box || snakeY < 0 || snakeY > 19*box || collision(newHead, snake)) {
            clearInterval(gameLoop);
            ctx.fillStyle = "rgba(255,0,0,0.5)";
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.fillText("¡PERDISTE!", 100, 150);
            setTimeout(()=> location.reload(), 2000);
        }
        
        snake.unshift(newHead);
    }
    
    let gameLoop = setInterval(draw, 100); // 100ms speed
  </script>
</body>
</html>
