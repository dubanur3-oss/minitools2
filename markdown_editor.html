  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    :root{--bg:#07090f;--bg2:#0d1120;--primary:#7000ff;--sec:#00f5ff;--surface:rgba(20,25,40,0.7);--border:rgba(112,0,255,0.3);--text:#e0e8ff;--dim:rgba(224,232,255,0.55)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    nav{background:rgba(7,9,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0}
    .nav-logo{font-size:1rem;font-weight:800;background:linear-gradient(90deg,var(--sec),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
    .back{color:var(--dim);text-decoration:none;font-size:.85rem;transition:color .2s}.back:hover{color:var(--sec)}
    .toolbar{display:flex;gap:6px;padding:10px 16px;background:rgba(7,9,15,.8);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center}
    .tb-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;transition:all .2s}
    .tb-btn:hover{border-color:var(--sec);color:var(--sec)}
    .tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
    .action-btns{margin-left:auto;display:flex;gap:6px}
    .btn-export{background:linear-gradient(135deg,var(--primary),#3d00cc);border:none;color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:700}
    .split{display:flex;flex:1;overflow:hidden}
    .pane{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .pane-label{padding:8px 16px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.04);font-weight:600;flex-shrink:0}
    .divider{width:3px;background:var(--border);cursor:col-resize;flex-shrink:0}
    textarea{flex:1;background:#0a0c14;border:none;padding:20px;font-family:'Courier New',monospace;font-size:.9rem;line-height:1.8;color:var(--text);resize:none;outline:none;overflow-y:auto}
    .preview{flex:1;overflow-y:auto;padding:24px 32px;background:#0a0c14}
    .preview h1,.preview h2,.preview h3,.preview h4{color:#fff;margin:20px 0 12px;font-family:'Outfit',sans-serif}
    .preview h1{font-size:1.8rem;border-bottom:2px solid var(--border);padding-bottom:10px}
    .preview h2{font-size:1.4rem;border-bottom:1px solid var(--border);padding-bottom:6px}
    .preview p{color:var(--dim);line-height:1.75;margin-bottom:14px}
    .preview a{color:var(--sec)}
    .preview code{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-family:'Courier New',monospace;font-size:.85rem;color:#c792ea}
    .preview pre{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto;margin-bottom:14px}
    .preview pre code{background:none;border:none;padding:0;color:#a8e6cf}
    .preview blockquote{border-left:3px solid var(--primary);padding:8px 16px;margin:16px 0;background:rgba(112,0,255,.06);border-radius:0 8px 8px 0}
    .preview blockquote p{color:var(--dim);font-style:italic;margin:0}
    .preview ul,.preview ol{color:var(--dim);padding-left:24px;margin-bottom:14px;line-height:1.75}
    .preview li{margin-bottom:4px}
    .preview table{width:100%;border-collapse:collapse;margin-bottom:16px}
    .preview th{background:rgba(112,0,255,.15);padding:10px 14px;text-align:left;border:1px solid var(--border);font-size:.85rem}
    .preview td{padding:10px 14px;border:1px solid rgba(255,255,255,.06);color:var(--dim);font-size:.85rem}
    .preview hr{border:none;border-top:1px solid var(--border);margin:20px 0}
    .preview img{max-width:100%;border-radius:8px}
    .preview strong{color:var(--text)}
    .wc{position:absolute;bottom:12px;right:16px;font-size:.72rem;color:var(--dim);background:rgba(7,9,15,.8);padding:3px 10px;border-radius:20px}

  <button class="tb-btn" onclick="ins('`','`')">{ }</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="insLine('# ')">H1</button>
  <button class="tb-btn" onclick="insLine('## ')">H2</button>

</div>

  <div class="divider" id="divider"></div>

<script>
  const ta=document.getElementById('editor');

  function render(){
    let md=ta.value;
    // Basic Markdown parser
    md=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // Code blocks
    md=md.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`);
    // Inline code
    md=md.replace(/`([^`]+)`/g,'<code>$1</code>');
    // Headers
    md=md.replace(/^#{6}\s+(.+)$/gm,'<h6>$1</h6>');
    md=md.replace(/^#{5}\s+(.+)$/gm,'<h5>$1</h5>');
    md=md.replace(/^#{4}\s+(.+)$/gm,'<h4>$1</h4>');
    md=md.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
    md=md.replace(/^##\s+(.+)$/gm,'<h2>$1</h2>');
    md=md.replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');
    // Horizontal rule
    md=md.replace(/^---+$/gm,'<hr>');
    // Blockquotes
    md=md.replace(/^>\s+(.+)$/gm,'<blockquote><p>$1</p></blockquote>');
    // Bold/italic/strikethrough
    md=md.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
    md=md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    md=md.replace(/\*(.+?)\*/g,'<em>$1</em>');
    md=md.replace(/~~(.+?)~~/g,'<s>$1</s>');
    // Links & images
    md=md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
    md=md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    // Unordered lists
    md=md.replace(/(^- .+(\n|$))+/gm,m=>`<ul>${m.split('\n').filter(l=>l.startsWith('- ')).map(l=>`<li>${l.slice(2)}</li>`).join('')}</ul>`);
    // Ordered lists
    md=md.replace(/(^\d+\. .+(\n|$))+/gm,m=>`<ol>${m.split('\n').filter(l=>/^\d+\. /.test(l)).map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('')}</ol>`);
    // Tables
    md=md.replace(/(?:^|\n)((?:\|[^|\n]+)+\|)(?:\n(?:\|[\s:|-]+)+\|)(\n(?:(?:\|[^|\n]+)+\|))+/gm,m=>{
      const rows=m.trim().split('\n').filter((_,i)=>i!==1);
      return`<table>${rows.map((r,i)=>{const cells=r.split('|').slice(1,-1);const tag=i===0?'th':'td';return`<tr>${cells.map(c=>`<${tag}>${c.trim()}</${tag}>`).join('')}</tr>`}).join('')}</table>`;
    });
    // Paragraphs
    md=md.replace(/\n\n+/g,'__DBLNL__');
    md=md.replace(/(?<!<\/[a-z]+>)__DBLNL__(?!<[a-z])/g,'</p><p>');
    md=md.replace(/__DBLNL__/g,'\n\n');
    if(!md.startsWith('<'))md='<p>'+md+'</p>';
    md=md.replace(/<p><\/p>/g,'');
    document.getElementById('preview').innerHTML=md;
  }

  function updateWc(){
    const w=ta.value.trim()===''?0:ta.value.trim().split(/\s+/).length;
    document.getElementById('wc').textContent=w+' palabras';
  }

  function ins(before,after){
    const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
    ta.setRangeText(before+sel+after);ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;ta.focus();render();
  }
  function insLine(prefix){
    const s=ta.selectionStart,v=ta.value;
    const lineStart=v.lastIndexOf('\n',s-1)+1;
    ta.setRangeText(prefix,lineStart,lineStart);ta.selectionStart=ta.selectionEnd=lineStart+prefix.length;ta.focus();render();
  }
  function insBlock(before,after){ins(before,after);}
  function insLink(){
    const url=prompt('URL del enlace:');if(!url)return;
    const s=ta.selectionStart,e=ta.selectionEnd,txt=ta.value.slice(s,e)||'texto';
    ta.setRangeText(`[${txt}](${url})`);ta.focus();render();
  }
  function copyMd(){navigator.clipboard.writeText(ta.value);}
  function exportHtml(){const blob=new Blob([`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7}h1,h2{border-bottom:1px solid #eee;padding-bottom:8px}code{background:#f4f4f4;padding:2px 6px;border-radius:3px}pre{background:#f4f4f4;padding:16px;border-radius:6px;overflow-x:auto}blockquote{border-left:3px solid #7000ff;padding:8px 16px;margin:16px 0;background:#f9f0ff}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px 12px}th{background:#f4f4f4}</style></head><body>${document.getElementById('preview').innerHTML}</body></html>`],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='documento.html';a.click();}
  function exportMd(){const blob=new Blob([ta.value],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='documento.md';a.click();}

  // Drag divider
  const div=document.getElementById('divider');
  let dragging=false;
  div.addEventListener('mousedown',()=>dragging=true);
  document.addEventListener('mousemove',e=>{if(!dragging)return;const split=document.querySelector('.split');const rect=split.getBoundingClientRect();const pct=Math.max(20,Math.min(80,(e.clientX-rect.left)/rect.width*100));split.children[0].style.flex=`0 0 ${pct}%`;split.children[2].style.flex=`0 0 ${100-pct}%`;});
  document.addEventListener('mouseup',()=>dragging=false);

  // Load example
  ta.value=`# ¡Bienvenido al Editor Markdown!

  render();updateWc();
</script>
