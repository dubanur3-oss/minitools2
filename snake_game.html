<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake | Toolbox Omega</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3189672198116367" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a13;color:#e2e8f0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
nav{width:100%;background:rgba(12,10,19,.95);border-bottom:1px solid rgba(255,255,255,.08);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{color:#00f5ff;font-weight:700;text-decoration:none;font-size:1rem}
.back{color:#94a3b8;text-decoration:none;font-size:.9rem}
.back:hover{color:#e2e8f0}
h1{margin:24px 0 6px;font-size:1.8rem;color:#00f5ff}
.sub{color:#94a3b8;font-size:.9rem;margin-bottom:16px}
.hud{display:flex;gap:32px;margin-bottom:12px;font-size:1rem;font-weight:600}
.hud span{color:#7c3aed}
canvas{border:2px solid rgba(0,245,255,.3);border-radius:8px;background:#0a0a18;display:block}
.controls{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.4);color:#e2e8f0;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn:hover{background:rgba(124,58,237,.4)}
.btn.primary{background:#7c3aed;border-color:#7c3aed}
.d-pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;margin-top:12px}
.d-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#e2e8f0;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.d-btn:active{background:rgba(124,58,237,.4)}
.msg{position:absolute;background:rgba(12,10,19,.9);border:1px solid rgba(0,245,255,.3);border-radius:12px;padding:24px 32px;text-align:center;display:none}
.msg h2{color:#00f5ff;margin-bottom:8px}
.msg p{color:#94a3b8;margin-bottom:16px}
.wrap{position:relative}
</style>
</head>
<body>
<nav><a class="brand" href="index.html">⚡ Toolbox Omega</a><a class="back" href="index.html">← Inicio</a></nav>
<h1>🐍 Snake</h1>
<p class="sub">Come la manzana, no te choques</p>
<div class="hud"><div>Puntos: <span id="score">0</span></div><div>Récord: <span id="best">0</span></div><div>Nivel: <span id="level">1</span></div></div>
<div class="wrap">
<canvas id="c" width="400" height="400"></canvas>
<div class="msg" id="msg"><h2 id="msgTitle">¡Listo!</h2><p id="msgText">Presiona Jugar para empezar</p><button class="btn primary" onclick="startGame()">▶ Jugar</button></div>
</div>
<div class="controls">
<button class="btn primary" onclick="startGame()">▶ Nuevo</button>
<button class="btn" onclick="togglePause()">⏸ Pausa</button>
</div>
<div class="d-pad">
<div></div><div class="d-btn" onclick="dir(0,-1)">▲</div><div></div>
<div class="d-btn" onclick="dir(-1,0)">◄</div><div></div><div class="d-btn" onclick="dir(1,0)">►</div>
<div></div><div class="d-btn" onclick="dir(0,1)">▼</div><div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SZ=20,COLS=20,ROWS=20;
let snake,dx,dy,food,score,best=0,loop,paused=false,running=false;
function cell(x,y,c){ctx.fillStyle=c;ctx.fillRect(x*SZ+1,y*SZ+1,SZ-2,SZ-2)}
function rand(){return{x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
function placeFood(){
  do{food=rand()}while(snake.some(s=>s.x===food.x&&s.y===food.y))
}
function draw(){
  ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,cv.width,cv.height);
  // grid
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*SZ,0);ctx.lineTo(i*SZ,cv.height);ctx.stroke()}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*SZ);ctx.lineTo(cv.width,i*SZ);ctx.stroke()}
  // food
  ctx.fillStyle='#f87171';
  ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,Math.PI*2);ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    const t=i===0?'#00f5ff':i<4?'#7c3aed':'#4c1d95';
    ctx.fillStyle=t;
    ctx.beginPath();
    const r=i===0?7:5;
    ctx.roundRect?ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,r):ctx.fillRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2);
    ctx.fill();
  });
}
function step(){
  if(paused)return;
  const h={x:snake[0].x+dx,y:snake[0].y+dy};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){
    endGame();return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score+=10+Math.floor(score/50)*5;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=Math.floor(score/100)+1;
    placeFood();
    clearInterval(loop);
    loop=setInterval(step,Math.max(80,200-Math.floor(score/50)*10));
  }else snake.pop();
  draw();
}
function startGame(){
  document.getElementById('msg').style.display='none';
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dx=1;dy=0;score=0;paused=false;running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('level').textContent=1;
  placeFood();clearInterval(loop);
  loop=setInterval(step,200);draw();
}
function endGame(){
  running=false;clearInterval(loop);
  if(score>best){best=score;document.getElementById('best').textContent=best}
  document.getElementById('msgTitle').textContent='💀 Game Over';
  document.getElementById('msgText').textContent='Puntuación: '+score;
  document.getElementById('msg').style.display='block';
}
function togglePause(){if(!running)return;paused=!paused}
function dir(x,y){
  if(!running||paused)return;
  if(x===1&&dx===-1||x===-1&&dx===1)return;
  if(y===1&&dy===-1||y===-1&&dy===1)return;
  dx=x;dy=y;
}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(m[e.key]){e.preventDefault();dir(...m[e.key])}
  if(e.key===' ')togglePause();
});
// show start
document.getElementById('msg').style.display='block';
ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,cv.width,cv.height);
</script>
</body></html>
